<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clara: 10 design directions</title>
<style>
  body { margin: 0; font: 15px/1.4 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif; background: #ededeb; color: #1a1a1a; }
  header { padding: 24px 32px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0; color: #555; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; padding: 24px 32px 48px; }
  figure { margin: 0; background: #fff; border: 1px solid #d6d6d2; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #e3e3df; font-size: 13px; }
  figcaption b { font-weight: 600; }
  figcaption span { color: #666; }
  a { color: inherit; }
  iframe { display: block; width: 100%; height: 760px; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Clara: 10 independent design directions</h1>
  <p>Each one is a separate clickable prototype. Open one full screen to try the navigation and the red-flag screen.</p>
</header>
<main id="grid"></main>
<script>
  const designs = [
    ["01-editorial", "Editorial clinical", "GPT-6.1 Sol"],
    ["02-swiss", "Swiss grid", "GPT-6 Astra"],
    ["03-pharmacy", "Pharmacy counter", "GPT-6.1 Terra"],
    ["04-instrument", "Precision instrument", "GPT-6 Sol"],
    ["05-native", "Native mobile", "GPT-6 Luna"],
    ["06-brutalist", "Honest web", "GPT-5.6 Sol"],
    ["07-letter", "Letter from your care team", "Claude Opus 5.5"],
    ["08-atlas", "Anatomical atlas", "Claude Sonnet 5.5"],
    ["09-night", "2 a.m. worry", "Claude Fable 5.2"],
    ["10-riso", "Risograph zine", "Claude Haiku 5.5"],
  ];
  document.getElementById("grid").innerHTML = designs.map(([dir, name, model]) => `
    <figure>
      <figcaption><b><a href="${dir}/index.html" target="_blank">${dir.slice(0, 2)} · ${name}</a></b><span>${model} · <a href="${dir}/NOTES.md" target="_blank">notes</a></span></figcaption>
      <iframe src="${dir}/index.html" loading="lazy" title="${name}"></iframe>
    </figure>`).join("");
</script>
</body>
</html>
